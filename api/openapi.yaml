components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token authentication. Format: Bearer <your_jwt_token>'

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number for pagination (starts from 1)
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    UserIdParam:
      name: id
      in: path
      required: true
      description: User ID
      schema:
        type: string
        format: uuid

    CustomerIdParam:
      name: id
      in: path
      required: true
      description: Customer ID
      schema:
        type: string
        format: uuid

    DealershipIdParam:
      name: id
      in: path
      required: true
      description: Dealership ID
      schema:
        type: string
        format: uuid

  schemas:
    # Authentication Schemas
    LoginDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: 'john.doe@example.com'
        password:
          type: string
          minLength: 6
          description: User's password (minimum 6 characters)
          example: 'securepassword123'

    RegisterDto:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
        - organizationId
        - role
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: 'jane.smith@example.com'
        password:
          type: string
          minLength: 6
          description: User's password (minimum 6 characters)
          example: 'securepassword123'
        firstName:
          type: string
          minLength: 2
          description: User's first name
          example: 'Jane'
        lastName:
          type: string
          minLength: 2
          description: User's last name
          example: 'Smith'
        organizationId:
          type: string
          format: uuid
          description: Organization ID
          example: '123e4567-e89b-12d3-a456-426614174000'
        dealershipId:
          type: string
          format: uuid
          nullable: true
          description: Dealership ID (optional)
          example: '123e4567-e89b-12d3-a456-426614174001'
        role:
          type: string
          enum: [admin, manager, sales, service, finance]
          description: User's role in the organization
          example: 'sales'

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        user:
          $ref: '#/components/schemas/User'
        expiresIn:
          type: integer
          description: Token expiration time in seconds
          example: 3600

    UserProfile:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'

    # User Management Schemas
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
          example: '123e4567-e89b-12d3-a456-426614174000'
        organizationId:
          type: string
          format: uuid
          description: Organization ID
          example: '123e4567-e89b-12d3-a456-426614174001'
        dealershipId:
          type: string
          format: uuid
          nullable: true
          description: Dealership ID
          example: '123e4567-e89b-12d3-a456-426614174002'
        email:
          type: string
          format: email
          description: User's email address
          example: 'john.doe@example.com'
        firstName:
          type: string
          description: User's first name
          example: 'John'
        lastName:
          type: string
          description: User's last name
          example: 'Doe'
        role:
          type: string
          enum: [admin, manager, sales, service, finance]
          description: User's role
          example: 'sales'
        permissions:
          type: object
          nullable: true
          description: User's specific permissions
          example: {"canViewReports": true, "canEditInventory": false}
        isActive:
          type: boolean
          description: Whether the user is active
          example: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          description: Last login timestamp
          example: '2024-01-15T10:30:00Z'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2024-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2024-01-15T10:30:00Z'

    CreateUserDto:
      type: object
      required:
        - email
        - firstName
        - lastName
        - role
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: 'new.user@example.com'
        firstName:
          type: string
          minLength: 2
          description: User's first name
          example: 'Alice'
        lastName:
          type: string
          minLength: 2
          description: User's last name
          example: 'Johnson'
        dealershipId:
          type: string
          format: uuid
          nullable: true
          description: Dealership ID
          example: '123e4567-e89b-12d3-a456-426614174002'
        role:
          type: string
          enum: [admin, manager, sales, service, finance]
          description: User's role
          example: 'manager'
        permissions:
          type: object
          nullable: true
          description: User's specific permissions
          example: {"canViewReports": true, "canEditInventory": true}

    UpdateUserDto:
