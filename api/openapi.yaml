openapi: '3.0.3'
info:
  title: 'Motocorp Dealership Management System API'
  description: |
    A comprehensive cloud-based dealership management system for motorcycle dealerships.
    This API provides multi-tenant architecture with complete CRUD operations for:
    - Inventory Management (motorcycles, parts, accessories)
    - Customer Relationship Management (CRM)
    - Sales Pipeline Management
    - Service Appointment Management
    - User Management with role-based access control
    - Real-time notifications and activity feeds
    
    ## Authentication
    This API uses JWT Bearer token authentication. Include the token in the Authorization header:
    `Authorization: Bearer <your_jwt_token>`
    
    ## Multi-Tenancy
    The API supports multi-tenant architecture where each organization has its own isolated data.
    The tenant context is automatically resolved from the authenticated user's JWT token.
    
    ## Rate Limiting
    API requests are rate-limited to ensure fair usage and system stability.
    
    ## Error Handling
    Standard HTTP status codes are used. Error responses include detailed error messages
    and validation errors where applicable.
  version: '1.0.0'
  contact:
    name: 'Motocorp DMS Support'
    email: 'support@motocorpdms.com'
    url: 'https://motocorpdms.com/support'
  license:
    name: 'Proprietary'

servers:
  - url: 'https://api.motocorpdms.com/v1'
    description: 'Production server'
  - url: 'https://staging-api.motocorpdms.com/v1'
    description: 'Staging server'
  - url: 'http://localhost:3000'
    description: 'Development server'

security:
  - BearerAuth: []

paths:
  # Health Check Endpoints
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns the health status of the API service
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # Authentication Endpoints
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account within an organization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticates user and returns JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/profile:
    get:
      tags:
        - Authentication
      summary: Get user profile
      description: Returns the authenticated user's profile information
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh authentication token
      description: Generates a new JWT token for the authenticated user
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Organization Management
  /organizations:
    get:
      tags:
        - Organizations
      summary: Get organization details
      description: Retrieves the current organization information
      responses:
        '200':
          description: Organization details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'

  # Dealership Management
  /dealerships:
    get:
      tags:
        - Dealerships
      summary: List dealerships
      description: Retrieves a paginated list of dealerships within the organization
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          description: Search dealerships by name
          schema:
            type: string
        - name: isActive
          in: query
          description: Filter by active status
          schema:
            type: boolean
        - name: timezone
          in: query
          description: Filter by timezone
          schema:
            type: string
        - name: sortBy
          in: query
          description: Field to sort by
          schema:
            type: string
            default: 'createdAt'
        - name: sortOrder
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: 'desc'
      responses:
        '200':
          description: Dealerships retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDealerships'

    post:
      tags:
        - Dealerships
      summary: Create a new dealership
      description: Creates a new dealership within the organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDealershipDto'
      responses:
        '201':
          description: Dealership created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dealership'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /dealerships/{id}:
    get:
      tags:
        - Dealerships
      summary: Get dealership by ID
      description: Retrieves a specific dealership by its ID
      parameters:
        - $ref: '#/components/parameters/DealershipIdParam'
      responses:
        '200':
          description: Dealership retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dealership'
        '404':
          description: Dealership not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Dealerships
      summary: Update dealership
      description: Updates an existing dealership's information
      parameters:
        - $ref: '#/components/parameters/DealershipIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDealershipDto'
      responses:
        '200':
          description: Dealership updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dealership'
        '404':
          description: Dealership not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Dealerships
      summary: Delete dealership
      description: Soft deletes a dealership (sets isActive to false)
      parameters:
        - $ref: '#/components/parameters/DealershipIdParam'
      responses:
        '204':
          description: Dealership deleted successfully
        '404':
          description: Dealership not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dealerships/{id}/stats:
    get:
      tags:
        - Dealerships
      summary: Get dealership statistics
      description: Retrieves aggregated statistics for a specific dealership
      parameters:
        - $ref: '#/components/parameters/DealershipIdParam'
      responses:
        '200':
          description: Dealership statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealershipStats'
        '404':
          description: Dealership not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # User Management
  /users:
    get:
      tags:
        - Users
      summary: List users
      description: Retrieves a paginated list of users within the organization
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: role
          in: query
          description: Filter users by role
          schema:
            type: string
            enum: [admin, manager, sales, service, finance]
        - name: dealershipId
          in: query
          description: Filter users by dealership ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'

    post:
      tags:
        - Users
      summary: Create a new user
      description: Creates a new user within the organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieves a specific user by their ID
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Users
      summary: Update user
      description: Updates an existing user's information
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Soft deletes a user (sets isActive to false)
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Customer Management
  /customers:
    get:
      tags:
        - Customers
      summary: List customers
      description: Retrieves a paginated list of customers with optional filtering
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          description: Search customers by name, email, or phone
          schema:
            type: string
        - name: dealershipId
          in: query
          description: Filter customers by dealership
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customers retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomers'

    post:
      tags:
        - Customers
      summary: Create a new customer
      description: Creates a new customer record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerDto'
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /customers/stats:
    get:
      tags:
        - Customers
      summary: Get customer statistics
      description: Retrieves aggregated customer statistics
      responses:
        '200':
          description: Customer statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerStats'

  /customers/{id}:
    get:
      tags:
        - Customers
      summary: Get customer by ID
      description: Retrieves a specific customer with their complete profile
      parameters:
        - $ref: '#/components/parameters/CustomerIdParam'
      responses:
        '200':
          description: Customer retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Customers
      summary: Update customer
      description: Updates an existing customer's information
      parameters:
        - $ref: '#/components/parameters/CustomerIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerDto'
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Customers
      summary: Delete customer
      description: Permanently deletes a customer record
      parameters:
        - $ref: '#/components/parameters/CustomerIdParam'
      responses:
        '204':
          description: Customer deleted successfully
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers/{id}/transfer:
    patch:
      tags:
        - Customers
      summary: Transfer customer to another dealership
      description: Transfers a customer from one dealership to another
      parameters:
        - $ref: '#/components/parameters/CustomerIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCustomerDto'
      responses:
        '200':
          description: Customer transferred successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Inventory Management
  /inventory:
    get:
      tags:
        - Inventory
      summary: List inventory items
      description: Retrieves a paginated list of inventory items with filtering and sorting
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: type
          in: query
          description: Filter by inventory type
          schema:
            type: string
            enum: [motorcycle, part, accessory]
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: dealershipId
          in: query
          description: Filter by dealership
          schema:
            type: string
            format: uuid
        - name: lowStock
          in: query
          description: Show only items with low stock
          schema:
            type: boolean
      responses:
        '200':
          description: Inventory items retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventory'

    post:
      tags:
        - Inventory
      summary: Create inventory item
      description: Creates a new inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryDto'
      responses:
        '201':
          description: Inventory item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /inventory/stats:
    get:
      tags:
        - Inventory
      summary: Get inventory statistics
      description: Retrieves aggregated inventory statistics
      parameters:
        - name: dealershipId
          in: query
          description: Filter statistics by dealership
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inventory statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryStats'

  /inventory/low-stock:
    get:
      tags:
        - Inventory
      summary: Get low stock items
      description: Retrieves items that are below their reorder point
      parameters:
        - name: dealershipId
          in: query
          description: Filter by dealership
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Low stock items retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'

  /inventory/views:
    get:
      tags:
        - Inventory
      summary: List inventory views
      description: Retrieves user's custom inventory views
      responses:
        '200':
          description: Inventory views retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryView'

    post:
      tags:
        - Inventory
      summary: Create inventory view
      description: Creates a new custom inventory view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryViewDto'
      responses:
        '201':
          description: Inventory view created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryView'

  /inventory/views/{id}:
    get:
      tags:
        - Inventory
      summary: Get inventory view by ID
      description: Retrieves a specific inventory view
      parameters:
        - name: id
          in: path
          required: true
          description: Inventory view ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inventory view retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryView'

    put:
      tags:
        - Inventory
      summary: Update inventory view
      description: Updates an existing inventory view
      parameters:
        - name: id
          in: path
          required: true
          description: Inventory view ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInventoryViewDto'
      responses:
        '200':
          description: Inventory view updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryView'

    delete:
      tags:
        - Inventory
      summary: Delete inventory view
      description: Deletes an inventory view
      parameters:
        - name: id
          in: path
          required: true
          description: Inventory view ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Inventory view deleted successfully

  /inventory/views/{id}/apply:
    get:
      tags:
        - Inventory
      summary: Apply inventory view
      description: Applies an inventory view with optional additional filters
      parameters:
        - name: id
          in: path
          required: true
          description: Inventory view ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Inventory view applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventory'

  /inventory/{id}:
    get:
      tags:
        - Inventory
      summary: Get inventory item by ID
      description: Retrieves a specific inventory item
      parameters:
        - name: id
          in: path
          required: true
          description: Inventory item ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inventory item retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '404':
          description: Inventory item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Inventory
      summary: Update inventory item
      description: Updates an existing inventory item
      parameters:
        - name: id
          in: path
          required: true
          description: Inventory item ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInventoryDto'
      responses:
        '200':
          description: Inventory item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '404':
          description: Inventory item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Inventory
      summary: Delete inventory item
      description: Soft deletes an inventory item
      parameters:
        - name: id
          in: path
          required: true
          description: Inventory item ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Inventory item deleted successfully
        '404':
          description: Inventory item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /inventory/{id}/stock:
    patch:
      tags:
        - Inventory
      summary: Update inventory stock
      description: Updates the stock quantity of an inventory item
      parameters:
        - name: id
          in: path
          required: true
          description: Inventory item ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockDto'
      responses:
        '200':
          description: Stock updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '404':
          description: Inventory item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Sales Management
  /sales:
    get:
      tags:
        - Sales
      summary: List sales
      description: Retrieves a paginated list of sales with filtering options
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: stage
          in: query
          description: Filter by sales stage
          schema:
            type: string
            enum: [lead, qualified, proposal, negotiation, closed_won, closed_lost]
        - name: salesPersonId
          in: query
          description: Filter by sales person
          schema:
            type: string
            format: uuid
        - name: dealershipId
          in: query
          description: Filter by dealership
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sales retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSales'

    post:
      tags:
        - Sales
      summary: Create a new sale
      description: Creates a new sales opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleDto'
      responses:
        '201':
          description: Sale created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /sales/{id}:
    get:
      tags:
        - Sales
      summary: Get sale by ID
      description: Retrieves a specific sale with detailed information
      parameters:
        - name: id
          in: path
          required: true
          description: Sale ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sale retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
        '404':
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Sales
      summary: Update sale
      description: Updates an existing sale
      parameters:
        - name: id
          in: path
          required: true
          description: Sale ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSaleDto'
      responses:
        '200':
          description: Sale updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Sales
      summary: Delete sale
      description: Deletes a sales record
      parameters:
        - name: id
          in: path
          required: true
          description: Sale ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Sale deleted successfully
        '404':
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sales/{id}/stage:
    patch:
