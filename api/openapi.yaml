          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Service Appointments
  /service-appointments:
    get:
      tags:
        - Service Appointments
      summary: List service appointments
      description: Retrieves a paginated list of service appointments
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          description: Filter by appointment status
          schema:
            type: string
            enum: [scheduled, in_progress, completed, cancelled]
        - name: technicianId
          in: query
          description: Filter by technician
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          description: Filter by appointment date (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Service appointments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceAppointments'

    post:
      tags:
        - Service Appointments
      summary: Create service appointment
      description: Creates a new service appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceAppointmentDto'
      responses:
        '201':
          description: Service appointment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAppointment'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /service-appointments/{id}:
    get:
      tags:
        - Service Appointments
      summary: Get service appointment by ID
      description: Retrieves a specific service appointment
      parameters:
        - name: id
          in: path
          required: true
          description: Service appointment ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service appointment retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAppointmentDetail'
        '404':
          description: Service appointment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Service Appointments
      summary: Update service appointment
      description: Updates an existing service appointment
      parameters:
        - name: id
          in: path
          required: true
          description: Service appointment ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceAppointmentDto'
      responses:
        '200':
          description: Service appointment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAppointment'
        '404':
          description: Service appointment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Service Appointments
      summary: Cancel service appointment
      description: Cancels a service appointment
      parameters:
        - name: id
          in: path
          required: true
          description: Service appointment ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Service appointment cancelled successfully
        '404':
          description: Service appointment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Notifications
  /notifications:
    get:
      tags:
