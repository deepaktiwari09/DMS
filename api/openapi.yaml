    # Organization Schema
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique organization identifier
          example: '123e4567-e89b-12d3-a456-426614174000'
        name:
          type: string
          description: Organization name
          example: 'Sunset Motorcycles Inc.'
        databaseName:
          type: string
          description: Tenant database name
          example: 'tenant_org_abc123'
        tier:
          type: string
          enum: [starter, professional, enterprise]
          description: Subscription tier
          example: 'professional'
        isActive:
          type: boolean
          description: Whether the organization is active
          example: true
        settings:
          type: object
          nullable: true
          description: Organization settings
          example: {"timezone": "America/New_York", "currency": "USD", "dateFormat": "MM/DD/YYYY"}
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2024-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2024-01-15T10:30:00Z'

    # Health Response Schema
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          description: Overall health status
          example: 'ok'
        timestamp:
          type: string
          format: date-time
          description: Health check timestamp
          example: '2024-01-15T10:30:00Z'
        version:
          type: string
          description: API version
          example: '1.0.0'
        uptime:
          type: integer
          description: Uptime in seconds
          example: 86400
        database:
          type: object
          properties:
            status:
              type: string
              enum: [connected, disconnected]
              example: 'connected'
            responseTime:
              type: integer
              description: Database response time in milliseconds
              example: 15

    # Common Schemas
    PaginationMeta:
      type: object
      properties:
        currentPage:
          type: integer
          description: Current page number
          example: 1
        totalPages:
          type: integer
          description: Total number of pages
          example: 5
        totalItems:
          type: integer
          description: Total number of items
          example: 95
        itemsPerPage:
          type: integer
          description: Number of items per page
          example: 20
        hasNextPage:
          type: boolean
          description: Whether there is a next page
          example: true
        hasPreviousPage:
          type: boolean
          description: Whether there is a previous page
          example: false

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human readable error message
          example: 'Resource not found'
        error:
          type: string
          description: Error type
          example: 'NotFound'
        statusCode:
          type: integer
          description: HTTP status code
          example: 404
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: '2024-01-15T10:30:00Z'
        path:
          type: string
          description: Request path that caused the error
          example: '/api/v1/customers/invalid-id'

    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          description: General validation error message
          example: 'Validation failed'
        error:
          type: string
          description: Error type
          example: 'Bad Request'
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: '2024-01-15T10:30:00Z'
        path:
          type: string
          description: Request path that caused the error
          example: '/api/v1/customers'
        errors:
          type: array
          description: Detailed validation errors
          items:
            type: object
            properties:
              field:
                type: string
                description: Field that failed validation
                example: 'email'
              message:
                type: string
                description: Validation error message
                example: 'must be a valid email address'
              value:
                description: Invalid value that was provided
                example: 'invalid-email'

