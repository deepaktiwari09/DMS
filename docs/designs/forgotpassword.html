<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>DealerFlow - Forgot Password</title>
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link
            crossorigin=""
            href="https://fonts.gstatic.com/"
            rel="preconnect"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <style type="text/tailwindcss">
            :root {
                --primary-color: #0d6efd;
                --background-color: #f8f9fa;
                --card-background-color: #ffffff;
                --text-primary: #212529;
                --text-secondary: #6c757d;
                --border-color: #dee2e6;
            }
            body {
                font-family: "Inter", sans-serif;
                background-color: var(--background-color);
                color: var(--text-primary);
            }
            .input_field {
                @apply block w-full px-4 py-3 rounded-lg border-[var(--border-color)] shadow-sm focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-transparent transition-shadow;
            }
        </style>
    </head>
    <body class="antialiased">
        <div
            class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden"
        >
            <div class="absolute inset-0">
                <img
                    alt="Background image of a modern car showroom"
                    class="w-full h-full object-cover"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuCR81gHjKmqJQkV9CY8YkRfGfxfiVbubIuPvoiFeWESyglb0L3GrBaKXusQnb2iEvy3DIr_rz8hRpOTAN1uiZLmvSn2qAiDacB0aymanbnKtSO5YVHPLyOAbLq4Jat0Ro-LCAeTMHB724mpa2xWkhMuHU3ZiqCTDsMtfiTidjBJQJ-m_zDH944VKVaJAC93ieSuPpREQVtKue50zvnkxhTGNSPNd_h9BHEBtIajA2kqdVKiezSQCgRJ8mWseKxq1z31wOeItQZuOUSD"
                />
                <div class="absolute inset-0 bg-black opacity-60"></div>
            </div>
            <div class="relative z-10 w-full max-w-md space-y-8">
                <div
                    class="bg-[var(--card-background-color)] p-8 sm:p-10 rounded-xl shadow-2xl"
                >
                    <div class="text-center mb-8">
                        <svg
                            class="mx-auto h-12 w-auto text-[var(--primary-color)]"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            ></path>
                        </svg>
                        <h1
                            class="text-3xl font-bold text-[var(--text-primary)] mt-4"
                        >
                            Forgot Password?
                        </h1>
                        <p class="text-md text-[var(--text-secondary)] mt-2">
                            No worries, we'll send you reset instructions.
                        </p>
                    </div>
                    <form action="#" class="space-y-6" method="POST">
                        <div>
                            <label
                                class="block text-sm font-medium text-[var(--text-secondary)]"
                                for="email"
                                >Email Address or Username</label
                            >
                            <div class="mt-1">
                                <input
                                    class="input_field"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email or username"
                                    required=""
                                    type="text"
                                />
                            </div>
                        </div>
                        <div>
                            <button
                                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-[var(--primary-color)] hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all"
                                type="submit"
                            >
                                Reset Password
                            </button>
                        </div>
                    </form>
                </div>
                <p class="text-center text-sm text-gray-200">
                    <a
                        class="font-medium text-white hover:text-gray-100"
                        href="#"
                        >← Back to Login</a
                    >
                </p>
            </div>
        </div>
    </body>
</html>
